{% extends "base.html" %}
{% block title %}Create Account · InternHub{% endblock %}

{% block content %}
<div class="auth-page-wrapper" style="max-width: 560px;">
  <div class="auth-ambient-glow"></div>

  <div class="auth-card-luxury">
    <!-- Brand Mark Header -->
    <div class="auth-brand-badge">
      <div class="brand-icon-box" style="width: 44px; height: 44px;">
        <svg viewBox="0 0 28 28" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 6v16M21 6v16M7 14h14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="14" cy="14" r="3.5" fill="#38bdf8"/>
        </svg>
      </div>
      <span class="brand-name" style="font-size: 24px;">Intern<strong>Hub</strong></span>
    </div>

    <h1 class="auth-title">Create Your Account</h1>
    <p class="auth-subtitle">Join top students and leading companies building the future.</p>

    <form method="post" action="{{ url_for('register') }}">
      <!-- Account Type Visual Card Picker -->
      <div class="form-floating-group">
        <label class="form-floating-label">Select Account Type</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px;">
          <label style="cursor: pointer;">
            <input type="radio" name="role" value="student" checked style="display: none;" id="role-student" onchange="updateRolePicker()">
            <div id="role-card-student" style="border: 2px solid var(--blue-vibrant); background: rgba(59, 130, 246, 0.12); padding: 14px; border-radius: var(--radius-md); text-align: center; transition: all 0.2s;">
              <i class="fa-solid fa-graduation-cap" style="font-size: 24px; color: var(--blue-light); margin-bottom: 6px;"></i>
              <div style="font-size: 13.5px; font-weight: 700; color: #ffffff;">Student / Seeker</div>
              <div style="font-size: 11px; color: var(--text-dark-muted); margin-top: 2px;">Apply to top roles</div>
            </div>
          </label>

          <label style="cursor: pointer;">
            <input type="radio" name="role" value="recruiter" style="display: none;" id="role-recruiter" onchange="updateRolePicker()">
            <div id="role-card-recruiter" style="border: 1px solid var(--border-dark); background: #0c1424; padding: 14px; border-radius: var(--radius-md); text-align: center; transition: all 0.2s;">
              <i class="fa-solid fa-briefcase" style="font-size: 24px; color: var(--text-dark-muted); margin-bottom: 6px;"></i>
              <div style="font-size: 13.5px; font-weight: 700; color: #ffffff;">Recruiter / Employer</div>
              <div style="font-size: 11px; color: var(--text-dark-muted); margin-top: 2px;">Hire top talent</div>
            </div>
          </label>
        </div>
      </div>

      <div class="form-floating-group">
        <label for="name" class="form-floating-label">Full Name</label>
        <div class="input-luxury-wrap">
          <i class="fa-solid fa-user lead-icon"></i>
          <input type="text" id="name" name="name" class="input-luxury" placeholder="e.g. Akhil Reddy" required autofocus>
        </div>
      </div>

      <div class="form-floating-group">
        <label for="email" class="form-floating-label">Email Address</label>
        <div class="input-luxury-wrap">
          <i class="fa-solid fa-envelope lead-icon"></i>
          <input type="email" id="email" name="email" class="input-luxury" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-floating-group">
        <label for="password" class="form-floating-label">Password (min. 6 characters)</label>
        <div class="input-luxury-wrap">
          <i class="fa-solid fa-lock lead-icon"></i>
          <input type="password" id="password" name="password" minlength="6" class="input-luxury" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-primary-glow">
        <i class="fa-solid fa-sparkles"></i> Create InternHub Account
      </button>
    </form>

    <div class="auth-footer">
      Already registered? <a href="{{ url_for('login') }}">Sign in to your account</a>
    </div>
  </div>
</div>

<script>
function updateRolePicker() {
  const isStudent = document.getElementById('role-student').checked;
  const cardS = document.getElementById('role-card-student');
  const cardR = document.getElementById('role-card-recruiter');

  if (isStudent) {
    cardS.style.borderColor = 'var(--blue-vibrant)';
    cardS.style.background = 'rgba(59, 130, 246, 0.12)';
    cardR.style.borderColor = 'var(--border-dark)';
    cardR.style.background = '#0c1424';
  } else {
    cardR.style.borderColor = 'var(--blue-vibrant)';
    cardR.style.background = 'rgba(59, 130, 246, 0.12)';
    cardS.style.borderColor = 'var(--border-dark)';
    cardS.style.background = '#0c1424';
  }
}
</script>
{% endblock %}
